[build]
  command = "npm run build"
  publish = "public"

[build.environment]
  NODE_VERSION = "24"
  DEMO_REGISTRATION = "true"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/v1/*"
  to = "/.netlify/functions/api/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/demo/register"
  to = "/.netlify/functions/api/demo/register"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(self), camera=()"

[[headers]]
  for = "/audio-young/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
